name: Publish API image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
      - name: Verify backend
        run: cargo test --locked --manifest-path backend/Cargo.toml
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable release
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          build-args: |
            AELIUM_RELEASE_ID=${{ github.ref_name }}
            AELIUM_BUILD_ID=${{ github.sha }}
            AELIUM_API_CONTRACT=propiedades-v3
      - name: Promote release to automatic channel
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${GITHUB_REPOSITORY,,}:stable" \
            "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
